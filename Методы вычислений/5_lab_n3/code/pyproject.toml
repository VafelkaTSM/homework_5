[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vafelka TSM", email = "telnovsm2006@gmail.com" }
]
requires-python = "==3.14.7"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "optuna>=5.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
